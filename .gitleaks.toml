# SPDX-License-Identifier: Apache-2.0
# Gitleaks configuration: the default rules, plus one allowlist for the
# published RFC 8032 and RFC 7515 test keys in test-vectors/ (test only, not secrets).

[extend]
useDefault = true

[[allowlists]]
description = "Published RFC 8032 section 7.1 and RFC 7515 Appendix A.3 test keys used by the test vectors"
paths = ['''^test-vectors/''']
