  <g fill="#2DD4BF" fill-opacity="0.4"><circle cx="1020" cy="90" r="6"/><circle cx="1110" cy="60" r="6"/><circle cx="1200" cy="110" r="6"/><circle cx="1150" cy="190" r="6"/><circle cx="1060" cy="170" r="6"/><circle cx="1235" cy="40" r="6"/><circle cx="1120" cy="560" r="6"/><circle cx="1200" cy="520" r="6"/><circle cx="1230" cy="600" r="6"/><circle cx="1060" cy="610" r="6"/></g>
