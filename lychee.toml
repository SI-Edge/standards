# SPDX-License-Identifier: Apache-2.0
# Link checker settings (https://lychee.cli.rs).
# Run locally from the repository root with:
#   lychee --root-dir "$PWD" './**/*.md' 'docs/**/*.html'

# Keep results for a day so repeated runs do not hit the same hosts again.
cache = true
max_cache_age = "1d"
# Do not cache rate limits or server errors, so they are retried next time.
cache_exclude_status = "429, 500.."

# Be gentle with remote hosts and retry short outages.
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30

# 429 means "rate limited", not "broken".
accept = ["200..=299", "429"]

# Email addresses in the docs are examples, not links to check.
include_mail = false

# Never try to reach local or private addresses.
exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Reserved example and test names (RFC 2606, RFC 6761).
  '^https?://([^/]+\.)?example\.(com|net|org)([/:?#]|$)',
  '^https?://[^/]+\.(example|test|invalid|localhost)([/:?#]|$)',
  '^https?://localhost([/:?#]|$)',
  '^https?://127\.0\.0\.1([/:?#]|$)',
  '^https?://\[::1\]([/:?#]|$)',
  # Liquid placeholders in the Jekyll site, such as {{ site.baseurl }}.
  '\{\{',
  '%7B%7B',
]
