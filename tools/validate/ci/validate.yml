name: Validate schemas and examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r tools/validate/requirements.txt
      - name: Validate examples
        run: python tools/validate/validate.py --quiet
      - name: Run tests
        run: python -m unittest discover -s tools/validate -v
